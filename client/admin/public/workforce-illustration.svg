<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Five cooperative workers — electrician, plumber, carpenter, cleaner and technician — standing in front of a neighbourhood with homes, trees, community buildings and map pins">
