services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gig
      POSTGRES_PASSWORD: gig_password
      POSTGRES_DB: gig
    ports:
      - "5433:5432"
    volumes:
      - gig-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gig -d gig"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gig-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gig-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gig-postgres-data:
  gig-redis-data: